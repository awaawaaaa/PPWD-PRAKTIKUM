name: Deploy to Teacher Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger aaPanel Webhook
        env:
          WEBHOOK_KEY: ${{ secrets.AAPANEL_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_KEY" ]; then
            echo "ERROR: AAPANEL_WEBHOOK_KEY belum terisi."
            exit 1
          fi

          HTTP_CODE=$(curl --globoff -k -sS \
            --output /tmp/webhook-response.txt \
            --write-out "%{http_code}" \
            --get \
            --data-urlencode "access_key=${WEBHOOK_KEY}" \
            "https://103.171.84.81:25181/hook")

          echo "HTTP status: $HTTP_CODE"
          echo "Webhook response:"
          cat /tmp/webhook-response.txt

          case "$HTTP_CODE" in
            2*) echo "Webhook request diterima." ;;
            *) echo "Webhook gagal dengan HTTP $HTTP_CODE."; exit 1 ;;
          esac
